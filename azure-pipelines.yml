# ==============================================================================================
#  G9SyncData — build, test, pack, mirror to GitHub, publish to nuget.org
# ==============================================================================================
#
#  Requires three SECRET pipeline variables (Pipeline → Edit → Variables, "Keep this value secret"):
#
#      AzureDevOps.PAT   Code (Read) on g9tm      — clones this repo for the GitHub mirror
#      Github.PAT        repo scope               — creates/pushes github.com/ImanKari/G9SyncData
#      NuGetApiKey       Push scope on nuget.org  — publishes the eleven packages
#
#  Shape, and why it differs from the G9MAUIControls pipeline it is modelled on:
#
#  1. ubuntu-latest, not windows-latest. Every project here targets net10.0 (netstandard2.0 for the
#     generator) — there is no MAUI workload and no net10.0-windows target — and the integration
#     tests need a real PostgreSQL, which is started with docker on the agent (see the note above
#     `jobs:` for why it is NOT an Azure `services:` container).
#
#  2. Tests run, and they gate the publish. G9MAUIControls has none; this library's correctness is
#     not eyeballable, so a package is only allowed out after the unit suite and the end-to-end
#     suite against a real PostgreSQL have both passed.
#
#  3. The GitHub mirror runs BEFORE the NuGet push, exactly as it does there. The packages carry
#     SourceLink pointing at github.com at a specific commit; publishing first would put packages on
#     nuget.org whose source links 404 until the mirror step happens to succeed.
#
#  The pipeline deliberately does NOT compute a version. G9SyncDataVersion in Directory.Build.props
#  is the single source of truth and is bumped by hand with release notes. A re-run without a bump
#  republishes nothing — the skip-duplicate flag makes that a no-op rather than a failure.
#
#  A PULL-REQUEST build runs everything up to and including pack, and publishes the packages as a
#  build artifact, but never mirrors and never pushes to nuget.org. That is the point: a PR proves
#  the packages can be produced without making any of it public.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

parameters:
  # The eleven redistributable libraries, in dependency order so the first failure is the root one.
  # tests/, samples/ and benchmarks/ inherit IsPackable=false and are deliberately absent.
  - name: libraries
    type: object
    default:
      - 'src/G9SyncData.Abstractions/G9SyncData.Abstractions.csproj'
      - 'src/G9SyncData.Protocol/G9SyncData.Protocol.csproj'
      - 'src/G9SyncData.SourceGenerators/G9SyncData.SourceGenerators.csproj'
      - 'src/G9SyncData.Client/G9SyncData.Client.csproj'
      - 'src/G9SyncData.Client.Sqlite/G9SyncData.Client.Sqlite.csproj'
      - 'src/G9SyncData.Client.SignalR/G9SyncData.Client.SignalR.csproj'
      - 'src/G9SyncData.Server/G9SyncData.Server.csproj'
      - 'src/G9SyncData.Server.PostgreSql/G9SyncData.Server.PostgreSql.csproj'
      - 'src/G9SyncData.Server.EfCore/G9SyncData.Server.EfCore.csproj'
      - 'src/G9SyncData.Server.SignalR/G9SyncData.Server.SignalR.csproj'
      - 'src/G9SyncData.Testing/G9SyncData.Testing.csproj'
  - name: repositoryName
    type: string
    default: 'G9SyncData'
  - name: githubOwner
    type: string
    default: 'ImanKari'

variables:
  buildConfiguration: 'Release'
  packageOutput: '$(Build.ArtifactStagingDirectory)/nuget'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CI: 'true'   # switches on ContinuousIntegrationBuild and the SourceLink `github` remote
  # True only for a real release build. Every mirror/publish step hangs off this one expression so
  # there is exactly one place to read "does this run make anything public?".
  isRelease: $[ and( eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest') ) ]

# ⛔ PostgreSQL is started by hand, NOT as a `services:` container, and that is not a style choice.
#
#    The WAL capture backend needs `wal_level=logical`, which postgres takes as a SERVER ARGUMENT (the
#    image passes its command through to postgres). An Azure `container:` resource has no way to supply
#    one: `options` is spliced into `docker create` BEFORE the image name, so it can set flags but never
#    arguments, and `wal_level` is not something POSTGRES_INITDB_ARGS can reach either.
#
#    On the default `wal_level=replica` the 11 `[PostgresLogicalFact]` tests (6 in WalCaptureModeTests,
#    5 in LogicalReplicationChangeSourceTests) SKIP - reported as skipped, not failed, so the capture
#    mode the guides recommend had zero coverage and a regression in it would have passed CI. The guard
#    step below makes that failure loud instead.
#
#    The 5 AndroidDeviceTests that also skip here are a DIFFERENT thing and are expected to: they need a
#    real device or emulator, which a hosted agent does not have. Do not chase those to zero.

jobs:
  # The iOS Brotli core of @g9tm/syncdata-lynx against the REAL Compression framework: Apple clang, Foundation, and the
  # module's own decoder (ios/src/core/G9SyncDataAppleBrotli.h) over the test vectors and the broken streams (N-SD-02,
  # N-SD-04). The Linux job can only stand libbrotlidec in for Apple's decoder. Two minutes; nothing is published without it.
  - job: ios_core
    displayName: iOS Brotli core (macOS, Apple Compression)
    pool:
      vmImage: macos-latest
    timeoutInMinutes: 15
    steps:
      - script: bash js/packages/lynx/scripts/test-ios-core.sh
        displayName: 'iOS Brotli core - Apple clang + Compression framework'

  - job: build_test_publish
    displayName: Build, test, pack and publish
    dependsOn: ios_core
    timeoutInMinutes: 90
    steps:

      # ────────────────────────────────────────────────────────────────────────────────────────
      - task: UseDotNet@2
        displayName: 'Install .NET SDK 10'
        inputs:
          packageType: sdk
          version: '10.0.x'

      # Only meaningful on a release run; a PR build has no use for any of the three secrets and
      # must not fail because a fork build cannot see them.
      - task: PowerShell@2
        displayName: 'Validate credentials'
        condition: and(succeeded(), eq(variables.isRelease, true))
        env:
          GITHUB_PAT: $(Github.PAT)
          AZDO_PAT: $(AzureDevOps.PAT)
          NUGET_KEY: $(NuGetApiKey)
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = 'Continue'
            $failed = @()

            # GitHub: /user round-trips the token and proves the scope is live.
            try {
                $u = Invoke-RestMethod -Uri 'https://api.github.com/user' -Method Get -Headers @{
                    Authorization = "token $env:GITHUB_PAT"
                    Accept        = 'application/vnd.github.v3+json'
                    'User-Agent'  = 'g9-pipeline'
                }
                Write-Host "[ok]   GitHub PAT valid (authenticated as $($u.login))"
            } catch {
                $failed += "GitHub PAT rejected: $($_.Exception.Response.StatusCode.value__)"
            }

            # Azure DevOps: listing projects proves Code(Read) will work for the mirror clone.
            try {
                $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$env:AZDO_PAT"))
                Invoke-RestMethod -Uri 'https://dev.azure.com/g9tm/_apis/projects?api-version=7.1' `
                    -Method Get -Headers @{ Authorization = "Basic $basic" } | Out-Null
                Write-Host "[ok]   Azure DevOps PAT valid"
            } catch {
                $failed += "Azure DevOps PAT rejected: $($_.Exception.Response.StatusCode.value__)"
            }

            # NuGet: there is NO endpoint that validates a push key without pushing. Anything that
            # claims otherwise is checking a public URL and always passes. Report honestly: presence
            # and shape only. A bad key surfaces at the push step, which is where it can be believed.
            if ([string]::IsNullOrWhiteSpace($env:NUGET_KEY)) {
                $failed += "NuGetApiKey is not set"
            } elseif ($env:NUGET_KEY.Length -lt 32) {
                $failed += "NuGetApiKey is present but implausibly short ($($env:NUGET_KEY.Length) chars)"
            } else {
                Write-Host "[note] NuGetApiKey present ($($env:NUGET_KEY.Length) chars). NOT verified —"
                Write-Host "       nuget.org offers no key-validation endpoint. Verified at push time."
            }

            if ($failed.Count) {
                $failed | ForEach-Object { Write-Host "##vso[task.logissue type=error]$_" }
                throw "Credential validation failed."
            }

      # ────────────────────────────────────────────────────────────────────────────────────────
      # SourceLink reads the `github` remote (GitRepositoryRemoteName in Directory.Build.props, set
      # because CI=true above). It only has to EXIST and be correct — nothing is pushed here and the
      # URL carries no token — so it is added on PR builds too, where it keeps pack honest.
      - task: PowerShell@2
        displayName: 'Add github remote for SourceLink'
        inputs:
          targetType: 'inline'
          workingDirectory: '$(Build.SourcesDirectory)'
          script: |
            # Continue, not Stop: git writes routine progress to stderr, and under Stop any native
            # command doing so becomes a terminating error. $LASTEXITCODE is the real success signal.
            $ErrorActionPreference = 'Continue'

            $url = "https://github.com/${{ parameters.githubOwner }}/${{ parameters.repositoryName }}.git"

            # `git remote` lists and exits 0 whether or not anything matches — unlike `remote remove`,
            # which errors when there is nothing to remove, the normal case on a fresh clone.
            if ((git remote) -contains 'github') {
                git remote set-url github $url
            } else {
                git remote add github $url
            }
            if ($LASTEXITCODE -ne 0) { throw "could not configure the github remote ($LASTEXITCODE)" }

            git remote -v

      # ────────────────────────────────────────────────────────────────────────────────────────
      # ──────────────────────────────────────────────────────────────────────────────────────────
      # max_replication_slots / max_wal_senders match the image defaults; they are stated because the
      # suite CREATES slots, and a run that leaked one would otherwise fail much later with an error
      # about exhausting them rather than about the leak.
      - script: |
          set -euo pipefail
          docker run -d --name g9sync-pg -p 5432:5432             -e POSTGRES_PASSWORD=g9sync-tests             -e POSTGRES_DB=postgres             postgres:18-alpine             -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          echo "waiting for postgres to accept connections..."
          for i in $(seq 1 60); do
            if docker exec g9sync-pg pg_isready -U postgres -q; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "##vso[task.logissue type=error]PostgreSQL did not become ready in 60s"
          docker logs g9sync-pg || true
          exit 1
        displayName: 'Start PostgreSQL (wal_level=logical)'

      # ⛔ The whole point of the step above. Without this the 16 logical-replication tests go back to
      # SKIPPING silently the moment the container config drifts, and a green pipeline would mean
      # nothing for the WAL capture mode. Assert the setting rather than trusting it.
      - script: |
          set -euo pipefail
          level=$(docker exec g9sync-pg psql -U postgres -tAc "SELECT current_setting('wal_level')")
          echo "wal_level = $level"
          if [ "$level" != "logical" ]; then
            echo "##vso[task.logissue type=error]wal_level is '$level', not 'logical' - the 11 [PostgresLogicalFact] tests would SKIP rather than run."
            exit 1
          fi
        displayName: 'Assert wal_level=logical (guards against silent skips)'

      # ──────────────────────────────────────────────────────────────────────────────────────────
      # One solution build; every later step runs --no-build against it. TreatWarningsAsErrors is on
      # family-wide, so a warning fails here rather than shipping into a package.
      - script: dotnet build G9SyncData.slnx -c $(buildConfiguration)
        displayName: 'Build (warnings are errors)'

      - script: >-
          dotnet test tests/G9SyncData.Tests/G9SyncData.Tests.csproj -c $(buildConfiguration) --no-build
          --logger trx --results-directory $(Agent.TempDirectory)/testresults
        displayName: 'Unit tests'

      # The suite creates and drops its OWN databases, which is why the container superuser is what
      # it connects as. It must leave nothing behind — in WAL mode that includes replication slots,
      # which survive a dropped database and would wedge the next run.
      - script: >-
          dotnet test tests/G9SyncData.IntegrationTests/G9SyncData.IntegrationTests.csproj -c $(buildConfiguration) --no-build
          --logger trx --results-directory $(Agent.TempDirectory)/testresults
        displayName: 'Integration tests (PostgreSQL)'
        env:
          G9SYNC_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=g9sync-tests;Database=postgres

      # ──────────────────────────────────────────────────────────────────────────────────────────
      # The TypeScript/Lynx twin (js/: @g9tm/syncdata + @g9tm/syncdata-lynx, ADR-0070). Same version, same release:
      # verified, run against the real sample server on this job's PostgreSQL (the interop and Lynx-sandbox suites
      # create and drop g9t_js_* databases), its Android module checked, and packed BEFORE anything is published.
      - task: NodeTool@0
        displayName: 'Node.js 22 (TypeScript/Lynx packages)'
        inputs:
          versionSpec: '22.x'

      - script: npm ci --no-audit --no-fund && npm run verify
        displayName: 'TypeScript/Lynx - versions, typecheck, unit + golden tests, Lynx sandbox vs the sample server, build, Lynx runtime gate'
        workingDirectory: js
        env:
          CI: 'true'
          G9SYNC_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=g9sync-tests;Database=postgres

      - script: npm run test:interop -w packages/syncdata
        displayName: 'TypeScript - interop with the real sample server (JSON + MessagePack) and database parity with the .NET client'
        workingDirectory: js
        env:
          CI: 'true'
          G9SYNC_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=g9sync-tests;Database=postgres

      - script: npm run test:android-jvm -w packages/lynx && npm run check:android-module -w packages/lynx
        displayName: 'Lynx - Brotli module core on the JVM, module compile check (Autolink provider)'
        workingDirectory: js
        env:
          JAVA_HOME: $(JAVA_HOME_17_X64)

      - script: npm run pack:all
        displayName: 'TypeScript/Lynx - pack'
        workingDirectory: js

      - task: PublishPipelineArtifact@1
        displayName: 'Attach the npm tarballs'
        inputs:
          targetPath: js/artifacts/npm
          artifact: npm

      # Slots survive a dropped database, so a leak here wedges the NEXT run rather than this one.
      # Reported, not failed: a leak is worth seeing, and failing a green test run over cleanup would
      # bury the result that matters.
      - script: |
          set +e
          slots=$(docker exec g9sync-pg psql -U postgres -tAc "SELECT count(*) FROM pg_replication_slots")
          echo "replication slots left behind: $slots"
          if [ "$slots" != "0" ]; then
            docker exec g9sync-pg psql -U postgres -c "SELECT slot_name, active FROM pg_replication_slots"
            echo "##vso[task.logissue type=warning]The suite left $slots replication slot(s) behind."
          fi
        displayName: 'Check for leaked replication slots'
        condition: succeededOrFailed()

      - script: |
          set +e
          docker rm -f g9sync-pg >/dev/null 2>&1
          echo "postgres container removed"
        displayName: 'Stop PostgreSQL'
        condition: always()

      - task: PublishTestResults@2
        displayName: 'Publish test results'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: $(Agent.TempDirectory)/testresults/*.trx
          failTaskOnFailedTests: true

      # ────────────────────────────────────────────────────────────────────────────────────────
      # Packed per project rather than per solution so a failure names one package. --no-build
      # reuses the build the tests just proved; packing the solution instead would also drag in the
      # samples, each of which logs a "packaging has been disabled" warning that means nothing.
      - ${{ each lib in parameters.libraries }}:
        - script: dotnet pack "${{ lib }}" -c $(buildConfiguration) --no-build -o "$(packageOutput)"
          displayName: 'Pack ${{ lib }}'

      - task: PowerShell@2
        displayName: 'List produced packages'
        inputs:
          targetType: 'inline'
          script: |
            $pkgs = Get-ChildItem "$(packageOutput)" -Filter *.nupkg -ErrorAction SilentlyContinue
            if (-not $pkgs) { throw "No .nupkg produced — nothing to publish." }
            $pkgs | ForEach-Object { Write-Host ("  {0}  ({1:N0} KB)" -f $_.Name, ($_.Length / 1KB)) }
            Write-Host "$($pkgs.Count) package(s), $((Get-ChildItem "$(packageOutput)" -Filter *.snupkg).Count) symbol package(s)"
            # The source generator ships analyzers/dotnet/cs only and carries no lib/ assembly, so it
            # is the one package with no .snupkg. Expect one fewer symbol package than packages.

      - task: PublishBuildArtifacts@1
        displayName: 'Publish packages as build artifact'
        inputs:
          PathtoPublish: '$(packageOutput)'
          ArtifactName: 'nuget'

      # ────────────────────────────────────────────────────────────────────────────────────────
      # Tag the commit the packages are built from: v<G9SyncDataVersion>. BEFORE the mirror, so the tag
      # reaches GitHub with it - a package whose version cannot be found in the repository is the first
      # thing anyone debugging a consumer trips over.
      #
      # ⛔ A WARNING, never a failure. The tag is bookkeeping; the release is the packages. The two ways
      #    this can go wrong are both worth saying out loud and neither is a reason to stop:
      #      - the PAT has Code(Read) only -> the push is refused;
      #      - the tag already exists on ANOTHER commit -> main moved without a version bump, and the
      #        nuget push below will skip every package as a duplicate. That is the real message.
      - task: PowerShell@2
        displayName: 'Tag the release commit'
        condition: and(succeeded(), eq(variables.isRelease, true))
        env:
          AZDO_PAT: $(AzureDevOps.PAT)
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = 'Continue'   # git reports progress on stderr
            $repo = '${{ parameters.repositoryName }}'
            $version = (Select-Xml -Path 'Directory.Build.props' -XPath '//G9SyncDataVersion').Node.InnerText.Trim()
            if ([string]::IsNullOrWhiteSpace($version)) {
                Write-Host "##vso[task.logissue type=warning]G9SyncDataVersion not found in Directory.Build.props; no tag created."
                exit 0
            }

            $tag = "v$version"
            $head = (git rev-parse HEAD).Trim()
            $remote = "https://$env:AZDO_PAT@g9tm.visualstudio.com/$repo/_git/$repo"

            $existing = (git ls-remote --tags $remote "refs/tags/$tag" | Select-Object -First 1)
            if ($existing) {
                $taggedCommit = ($existing -split "\s+")[0]
                # An annotated tag lists the TAG object; the commit it points at is the peeled ^{} line.
                $peeled = (git ls-remote --tags $remote "refs/tags/$tag^{}" | Select-Object -First 1)
                if ($peeled) { $taggedCommit = ($peeled -split "\s+")[0] }

                if ($taggedCommit -eq $head) {
                    Write-Host "Tag $tag already points at $head."
                } else {
                    Write-Host "##vso[task.logissue type=warning]Tag $tag exists on $taggedCommit but this build is $head. G9SyncDataVersion was not bumped: every package below will be skipped as a duplicate."
                }
                exit 0
            }

            git -c user.name='g9-pipeline' -c user.email='pipeline@g9tm.invalid' tag -a $tag -m "G9SyncData $version" $head
            git push $remote "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) {
                Write-Host "##vso[task.logissue type=warning]Could not push tag $tag (does AzureDevOps.PAT have Code: Read & Write?). The release continues."
                exit 0
            }
            Write-Host "Tagged $head as $tag."

      # ────────────────────────────────────────────────────────────────────────────────────────
      # Mirror BEFORE publishing, so the commit the packages' SourceLink points at is already public.
      - task: PowerShell@2
        displayName: 'Mirror Azure DevOps repo to GitHub'
        condition: and(succeeded(), eq(variables.isRelease, true))
        env:
          GITHUB_PAT: $(Github.PAT)
          AZDO_PAT: $(AzureDevOps.PAT)
        inputs:
          targetType: 'inline'
          script: |
            # Stop for the REST calls (their failures are real and must halt), relaxed to Continue
            # around the git invocations, which report progress on stderr.
            $ErrorActionPreference = 'Stop'
            $owner = '${{ parameters.githubOwner }}'
            $repo  = '${{ parameters.repositoryName }}'
            $headers = @{
                Authorization = "token $env:GITHUB_PAT"
                Accept        = 'application/vnd.github.v3+json'
                'User-Agent'  = 'g9-pipeline'
            }

            # Create the GitHub repo on first run. PUBLIC: these are MIT packages whose SourceLink and
            # PackageProjectUrl point here, and both are dead links against a private repo.
            try {
                Invoke-RestMethod -Uri "https://api.github.com/repos/$owner/$repo" -Headers $headers | Out-Null
                Write-Host "GitHub repo $owner/$repo exists"
            } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
                Write-Host "Creating $owner/$repo ..."
                $body = @{
                    name        = $repo
                    private     = $false
                    auto_init   = $false
                    description = 'Offline-first sync for .NET: PostgreSQL capture, SQLite clients, resumable chunked transfer. NativeAOT-friendly.'
                    homepage    = "https://www.nuget.org/packages/$repo.Client"
                } | ConvertTo-Json
                Invoke-RestMethod -Uri 'https://api.github.com/user/repos' -Headers $headers `
                    -Method Post -Body $body -ContentType 'application/json' | Out-Null
            }

            $work = Join-Path $env:AGENT_TEMPDIRECTORY 'mirror'
            if (Test-Path $work) { Remove-Item $work -Recurse -Force }
            New-Item -ItemType Directory -Path $work | Out-Null

            $source = "https://$env:AZDO_PAT@g9tm.visualstudio.com/$repo/_git/$repo"
            $dest   = "https://$($owner):$env:GITHUB_PAT@github.com/$owner/$repo.git"

            $ErrorActionPreference = 'Continue'
            git clone --mirror $source "$work/$repo.git"
            if ($LASTEXITCODE -ne 0) { throw "mirror clone failed" }

            Push-Location "$work/$repo.git"
            try {
                # --mirror makes GitHub match Azure exactly, which is what "mirror" has to mean:
                # a branch deleted here must not linger there. Azure stays the source of truth.
                git push --mirror $dest
                if ($LASTEXITCODE -ne 0) { throw "mirror push failed" }
            } finally {
                Pop-Location
                Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
            }
            Write-Host "Mirrored to https://github.com/$owner/$repo"

      # ────────────────────────────────────────────────────────────────────────────────────────
      - task: PowerShell@2
        displayName: 'Publish packages to nuget.org'
        condition: and(succeeded(), eq(variables.isRelease, true))
        env:
          NUGET_KEY: $(NuGetApiKey)
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = 'Continue'   # dotnet nuget push reports on stderr
            $failures = @()

            # .snupkg is pushed by nuget alongside its .nupkg automatically, so only glob .nupkg —
            # pushing symbols explicitly double-pushes and reports a spurious conflict.
            foreach ($pkg in Get-ChildItem "$(packageOutput)" -Filter *.nupkg) {
                Write-Host "── $($pkg.Name)"
                dotnet nuget push $pkg.FullName `
                    --api-key $env:NUGET_KEY `
                    --source https://api.nuget.org/v3/index.json `
                    --skip-duplicate
                if ($LASTEXITCODE -ne 0) { $failures += $pkg.Name }
            }

            if ($failures.Count) {
                $failures | ForEach-Object { Write-Host "##vso[task.logissue type=error]Push failed: $_" }
                throw "$($failures.Count) package(s) failed to publish."
            }
            Write-Host "All packages published (or already present — skip-duplicate)."

      # The npm packages (1.2+), after the NuGet ones and under the same rule: release only, a version already on npm is
      # skipped (re-running a release is harmless). Needs the secret variable NpmToken (an automation token of the npm
      # organisation g9tm); without it the step says so and the tarballs stay attached above.
      - task: PowerShell@2
        displayName: 'Publish npm packages (@g9tm)'
        condition: and(succeeded(), eq(variables.isRelease, true))
        env:
          NPM_TOKEN: $(NpmToken)
        inputs:
          targetType: 'inline'
          workingDirectory: js
          script: |
            # npm writes to stderr on success too (notices; E404 from `npm view` for a first publish). Under the task's
            # ErrorActionPreference=Stop, Windows PowerShell turns that into a terminating error even with 2>$null
            # (build 526): exit codes decide here, and a failed publish throws below.
            $ErrorActionPreference = 'Continue'
            # Not '$' + '(NpmToken)' written as one macro: Azure expands it inside this script as well, and the check
            # then compared the token with itself (build 514 published NuGet but skipped npm as 'not set').
            if ([string]::IsNullOrWhiteSpace($env:NPM_TOKEN) -or $env:NPM_TOKEN -eq ('$' + '(NpmToken)')) {
                Write-Host "##vso[task.logissue type=warning]NpmToken is not set: the npm packages were packed (artifact 'npm') but not published."
                exit 0
            }
            $npmrc = Join-Path $env:AGENT_TEMPDIRECTORY 'g9tm.npmrc'
            Set-Content -LiteralPath $npmrc -Value "//registry.npmjs.org/:_authToken=$($env:NPM_TOKEN)`nregistry=https://registry.npmjs.org/"
            try {
                foreach ($tarball in Get-ChildItem -Path 'artifacts/npm' -Filter '*.tgz') {
                    $manifest = (& tar -xOzf $tarball.FullName package/package.json) | ConvertFrom-Json
                    $id = "$($manifest.name)@$($manifest.version)"
                    $existing = & npm view $id version --userconfig $npmrc 2>$null
                    if ($LASTEXITCODE -eq 0 -and $existing) {
                        Write-Host "$id is already on npm; skipping."
                        continue
                    }
                    & npm publish $tarball.FullName --access public --userconfig $npmrc
                    if ($LASTEXITCODE -ne 0) { throw "npm publish failed for $id (exit code $LASTEXITCODE)." }
                    Write-Host "Published $id"
                }
            }
            finally {
                Remove-Item -LiteralPath $npmrc -Force -ErrorAction SilentlyContinue
            }
